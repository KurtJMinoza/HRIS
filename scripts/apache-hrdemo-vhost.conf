# Copy this block into C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Then restart Apache from XAMPP Control Panel.
#
# Cloudflare (orange cloud) connects to your server on port 80/443 - not 5200.
# This vhost proxies hrdemo.agctek.co -> Vite dev server on 127.0.0.1:5200.

<VirtualHost *:80>
    ServerName hrdemo.agctek.co

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:5200/$1 [P,L]
    RewriteCond %{HTTP:Upgrade} =WebSocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:5200/$1 [P,L]

    ProxyPass / http://127.0.0.1:5200/
    ProxyPassReverse / http://127.0.0.1:5200/
</VirtualHost>
