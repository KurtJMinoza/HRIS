<!doctype html>
<html lang="en" class="light" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <link rel="icon" href="%BASE_URL%logo/AGCTek.png">
    <link rel="preload" as="image" href="%BASE_URL%logo/AGCTek.png" />
    <meta http-equiv="Cache-Control" content="no-store, max-age=0, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="hris-app-version" content="__HRIS_APP_VERSION__" />
    <script>
      (() => {
        const version = '__HRIS_APP_VERSION__'
        const key = 'hris_frontend_cache_version'
        const marker = '_hris_cache_refreshed'

        try {
          const current = window.localStorage.getItem(key)
          const params = new URLSearchParams(window.location.search)

          if (current !== version && !params.has(marker)) {
            window.localStorage.setItem(key, version)
            try {
              sessionStorage.removeItem('hris_chunk_reload_version')
            } catch (_) {}

            const clearCaches = []
            if ('caches' in window) {
              clearCaches.push(
                window.caches.keys().then((names) => Promise.all(names.map((name) => window.caches.delete(name))))
              )
            }
            if ('serviceWorker' in navigator) {
              clearCaches.push(
                navigator.serviceWorker.getRegistrations().then((registrations) =>
                  Promise.all(registrations.map((registration) => registration.unregister()))
                )
              )
            }

            Promise.allSettled(clearCaches).finally(() => {
              params.set(marker, version)
              window.location.replace(`${window.location.pathname}?${params.toString()}${window.location.hash}`)
            })
          }
        } catch (_) {
          // Cache reset is best-effort; the app should still boot if browser storage is unavailable.
        }
      })()
    </script>
    <title>Human Resource Information System</title>
  </head>
  <body>
    <div id="root" class="min-h-screen bg-white dark:bg-background"></div>
    <script type="module" src="/src/main.jsx?v=__HRIS_APP_VERSION__"></script>
  </body>
</html>
